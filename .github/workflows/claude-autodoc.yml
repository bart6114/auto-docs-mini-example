name: Claude autodoc

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-autodoc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autodoc:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'claude[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Keep documentation aligned with the pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            /autodoc

            Repository: ${{ github.repository }}
            Pull request: ${{ github.event.pull_request.number }}
            Base branch: ${{ github.base_ref }}
            Head branch: ${{ github.head_ref }}
          claude_args: |
            --max-turns 60
            --allowedTools "Skill,Read,Grep,Glob,Edit,Write,Bash(npm:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
